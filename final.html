
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uma surpresa para você ❤️</title>
  <link rel="stylesheet" href="final.css">
</head>
<body>
  <main class="surprise">
    <div class="burst"></div>

    <p class="eyebrow">UMA SURPRESA PARA VOCÊ</p>

    <div class="photo-stage">
      <div class="photo-frame">
        <img
          src="assets/foto-dela.jpg.jpg"
          alt="A pessoa mais especial do mundo"
          id="herPhoto"
        >
      </div>
      <span class="spark spark-one">✦</span>
      <span class="spark spark-two">♥</span>
      <span class="spark spark-three">✦</span>
    </div>

    <h1 id="loveText">EU TE AMOOOOOOO!</h1>

    <p class="subtitle" id="subtitle">
      Você é minha pessoa favorita. ❤️
    </p>

    <button id="musicButton" type="button">
      ♫ Tocar nossa música
    </button>

    <audio id="loveMusic" loop preload="none">
      <source src="assets/YTDown (mp3cut.net).mp3" type="audio/mpeg">
    </audio>

    <p class="signature">Feito com amor, só pra você ♥</p>
  </main>

  <script src="final.js"></script>
</body>
</html>
